    @media (prefers-color-scheme: dark){
      .ring{ stroke:#f5f5f5 }
      .dot{ fill:#f5f5f5 }
    }
  </style>
  <circle class="ring" cx="16" cy="16" r="11" fill="none" stroke-width="4.2"
